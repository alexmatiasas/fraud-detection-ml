# gitleaks config — fraud-detection-ml
# Loaded automatically from the repo root by the pre-commit gitleaks hook.
# Extends the default ruleset with DagsHub-specific detection so that a
# DagsHub access token can never be committed accidentally.

title = "fraud-detection-ml gitleaks config"

[extend]
useDefault = true

# A DagsHub token embedded in a URL's userinfo, e.g. the exact leak we had:
#   https://<token>@dagshub.com/<user>/<repo>.mlflow
[[rules]]
id = "dagshub-url-token"
description = "DagsHub access token embedded in a dagshub.com URL"
regex = '''https://[a-fA-F0-9]{32,40}@dagshub\.com/'''
secretGroup = 0
entropy = 3.0

# A DagsHub token assigned to an env var in a committed file (e.g. a .env
# that was force-added or an exported var in a shell script).
[[rules]]
id = "dagshub-env-token"
description = "DagsHub access token assigned to an env var"
regex = '''(?i)(dagshub[_-]?(?:token|user_token|password)|mlflow[_-]tracking[_-]password)\s*[:=]\s*["']?([a-fA-F0-9]{32,40})'''
secretGroup = 2
entropy = 3.0

[allowlist]
description = "Placeholder values used in tests and documentation"
regexes = [
  "sekret123",
]
