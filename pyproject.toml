[project]
name = "fraud-detection-ml"
version = "0.1.0"
description = "End-to-end ML pipeline for IEEE-CIS fraud detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "device-detector>=6.2.0",
    "dvc>=3.67.0",
    "dvclive>=3.49.0",
    "fastapi>=0.135.1",
    "joblib>=1.5.3",
    "kagglehub>=1.0.0",
    "lightgbm>=4.6.0",
    "mlflow>=3.10.1",
    "numba>=0.59",
    "numpy>=2.4.3",
    "omegaconf>=2.3.0",
    "optuna>=4.8.0",
    "optuna-integration[mlflow]>=4.9.0",
    "pandas>=2.3.3",
    "pandera>=0.30.0",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
    "scikit-learn>=1.8.0",
    "shap>=0.49.1",
    "tqdm>=4.66.0",
    "uvicorn[standard]>=0.42.0",
    "xgboost>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "commitizen>=4.13.9",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "plotly>=6.6.0",
    "pre-commit>=4.5.1",
    "prek>=0.3.8",
    "hypothesis>=6.129.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.6",
    "seaborn>=0.13.2",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "dvc-s3>=3.3.0",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src"]
reportMissingTypeStubs = false
pythonVersion = "3.11"

# These are to handle src as a package:

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdml"]
