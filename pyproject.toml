[project]
name = "fraud-detection-ml"
version = "0.1.0"
description = "End-to-end ML pipeline for IEEE-CIS fraud detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dvc>=3.67.0",
    "kagglehub>=1.0.0",
    "omegaconf>=2.3.0",
    "pandera>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "commitizen>=4.13.9",
    "pre-commit>=4.5.1",
    "prek>=0.3.8",
    "ruff>=0.15.6",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[dependency-groups]
