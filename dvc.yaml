stages:
  download:
    cmd: uv run python scripts/download_data.py
    outs:
    - data/raw:
        persist: true
  prepare:
    cmd: uv run python scripts/prepare_data.py
    deps:
    - configs/data.yaml
    - data/raw
    params:
    - configs/data.yaml:
        - base_dir
        - files
        - join_key
        - target
    outs:
    - data/processed:
        persist: true
  features:
    cmd: uv run python -m src.features.build_features
    deps:
    - configs/features.yaml
    - configs/data.yaml
    - data/processed
    - src/features/
    - src/schemas/
    params:
    - configs/features.yaml:
        - transaction
        - identity
        - engineered
        - encoding
        - imputation
    - configs/data.yaml:
        - processed_dir
        - features_dir
    outs:
    - data/features:
        persist: true
