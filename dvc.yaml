stages:
  download:
    cmd: uv run python scripts/download_data.py
    outs:
      - data/raw:
          persist: true
    frozen: true
  prepare:
    cmd: uv run python scripts/prepare_data.py
    deps:
      - configs/data.yaml
      - data/raw
    params:
      - configs/data.yaml:
          - base_dir
          - files
          - join_key
          - target
    outs:
      - data/processed:
          persist: true
  train:
    cmd: uv run python -m fdml.models.train
    deps:
      - configs/train.yaml
      - configs/features.yaml
      - configs/data.yaml
      - src/fdml/models/
      - src/fdml/features/
      - src/fdml/schemas/
      - data/processed
    params:
      - configs/train.yaml:
          - model
          - split
          - early_stopping
    outs:
      - models/pipeline.joblib
      - dvclive/metrics.json:
          cache: false
      - dvclive/plots
