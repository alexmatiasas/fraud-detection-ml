# $schema: ../schemas/mlflow.schema.json
# ── MLflow ────────────────────────────────────────────────────────────────────
# Si existe .env con DAGSHUB_USER_TOKEN, usa DagsHub remote.
# Si no, usa SQLite local (soporta Model Registry).

# ── Tracking server ───────────────────────────────────────────────────────────
tracking:
  experiment_name: fraud-test
  run_name: lgbm_baseline
  # Local: sqlite:///mlruns.db  |  DagsHub: https://dagshub.com/user/repo.mlflow
  tracking_uri: sqlite:///mlruns.db
  backend: local  # auto-detected if .env has dagshub credentials

# ── Model Registry ────────────────────────────────────────────────────────────
registry:
  enabled: true
  model_name: fraud-detection-lgbm
  alias: champion  # champion | challenger | candidate
  # Quality gate: versiones por debajo de estos mínimos NO se registran
  # (tag validation_status=rejected). 0 = umbral desactivado.
  min_auc: 0.83
  min_average_precision: 0.35

# ── Dataset lineage ───────────────────────────────────────────────────────────
datasets:
  enabled: true
  context: training

# ── Artifacts ─────────────────────────────────────────────────────────────────
log_model: true
log_feature_importance: true
